name: Update PokéSurvivor meta

on:
  schedule:
    - cron: "17 */6 * * *" # cada 6 horas (minuto 17 para evitar la congestión de :00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-meta
  cancel-in-progress: false

jobs:
  update-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate public/meta.json
        run: python scripts/update_pokesurvivor_meta.py

      - name: Validate JSON
        run: python -m json.tool public/meta.json > /dev/null

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/meta.json
          if git diff --cached --quiet; then
            echo "No hay cambios en public/meta.json; nada que commitear."
            exit 0
          fi
          git commit -m "chore(meta): actualizar public/meta.json [skip ci]"
          git push
